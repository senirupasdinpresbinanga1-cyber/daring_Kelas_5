<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembelajaran Daring - Seni Rupa</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { 
            background: url('wallpaper.png') no-repeat center center; 
            color: #f1f5f9; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow: hidden; position: relative;
        }
        body::before {
            content: ''; position: absolute; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255, 0, 128, 0.25), transparent 70%);
            top: -50px; left: -50px; border-radius: 50%; z-index: 0; filter: blur(60px);
        }
        body::after {
            content: ''; position: absolute; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.2), transparent 70%);
            bottom: -50px; right: -50px; border-radius: 50%; z-index: 0; filter: blur(70px);
        }
        
        /* TOMBOL REKAP LIVE DI POJOK KANAN ATAS */
        .btn-top-right {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(22, 20, 42, 0.75); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 242, 254, 0.4); color: #00f2fe; padding: 10px 18px;
            font-size: 12px; font-weight: 800; border-radius: 12px; cursor: pointer; text-decoration: none;
            display: flex; align-items: center; gap: 8px; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .btn-top-right:hover {
            background: linear-gradient(135deg, #ff007a, #7928ca); color: #fff; border-color: transparent;
            box-shadow: 0 6px 20px rgba(255, 0, 122, 0.4); transform: translateY(-2px);
        }

        .login-card { 
            position: relative; z-index: 1; background: rgba(22, 20, 42, 0.75); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; 
            padding: 40px 35px; width: 100%; max-width: 420px; text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .art-icon-badge {
            width: 60px; height: 60px; margin: 0 auto 15px auto;
            background: linear-gradient(135deg, #ff007a, #7928ca); border-radius: 16px;
            display: flex; justify-content: center; align-items: center; font-size: 26px; color: #fff;
            box-shadow: 0 8px 20px rgba(255, 0, 122, 0.4);
        }
        .login-card h1 { 
            font-size: 22px; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; 
            background: linear-gradient(90deg, #00f2fe, #4facfe, #ff007a);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-card p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 28px; font-weight: 600; letter-spacing: 0.5px; }
        .input-group { position: relative; margin-bottom: 22px; text-align: left; }
        .input-group label { font-size: 11px; text-transform: uppercase; color: #cbd5e1; font-weight: 700; display: block; margin-bottom: 8px; letter-spacing: 0.8px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 15px; }
        .input-group input { 
            width: 100%; padding: 13px 14px 13px 42px; background: rgba(10, 10, 24, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: all 0.3s ease; 
        }
        .input-group input:focus { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.25); background: rgba(15, 15, 35, 0.8); }
        .btn-login { 
            width: 100%; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #090d16; border: none; padding: 14px; 
            font-size: 14px; font-weight: 800; border-radius: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s ease; margin-top: 10px; box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(0, 242, 254, 0.45); filter: brightness(1.1); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(9, 13, 22, 0.3); border-top-color: #090d16; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { margin-top: 25px; font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- TOMBOL REKAP LIVE POJOK KANAN ATAS -->
    <a href="live.html" class="btn-top-right"><i class="fas fa-chart-line"></i> Rekap Live</a>

    <div class="login-card">
        <div class="art-icon-badge"><i class="fas fa-palette"></i></div>
        <h1>Pembelajaran Daring</h1>
        <p class="subtitle">SD INPRES BINANGA 1 - SENI RUPA</p>

        <form id="formLogin">
            <div class="input-group">
                <label>Absen Untuk Kehadiran</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" required placeholder="Masukkan nomor absen" autocomplete="off">
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" required placeholder="Masukkan password">
                </div>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">
                <div class="spinner" id="btnSpinner"></div>
                <span id="btnText">Masuk Pembelajaran</span>
            </button>
        </form>

        <div class="footer">&copy; 2026 EduArt Digital System</div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycby1XqvBwlfW_yu3IRz3-Mz3nnB1RrtTNzIpCxkRMV2cNy-UPcw902RY75zTFoThJQQ1fA/exec';

        function getDeviceToken() {
            let token = localStorage.getItem('device_token_app');
            if (!token) {
                token = 'DEV-' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
                localStorage.setItem('device_token_app', token);
            }
            return token;
        }

        document.getElementById("formLogin").addEventListener("submit", function(event) {
            event.preventDefault();
            const btnText = document.getElementById("btnText");
            const btnSpinner = document.getElementById("btnSpinner");
            const submitBtn = document.getElementById("submitBtn");

            const nisn = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const deviceToken = getDeviceToken();

            btnText.innerText = "Memeriksa Data...";
            btnSpinner.style.display = "inline-block";
            submitBtn.disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'login', nisn: nisn, password: password, deviceToken: deviceToken })
            })
            .then(res => res.json())
            .then(data => {
                btnText.innerText = "Masuk Pembelajaran";
                btnSpinner.style.display = "none";
                submitBtn.disabled = false;

                if (data.status === 'success') {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('nisnSiswa', nisn);
                    localStorage.setItem('namaSiswa', data.nama);
                    localStorage.setItem('kelasSiswa', data.kelas || 'Admin');
                    localStorage.setItem('role', data.role);

                    if (data.role === 'admin') window.location.href = 'admin.html';
                    else window.location.href = 'pembelajaran.html';
                } else {
                    alert(data.message);
                }
            })
            .catch(() => {
                btnText.innerText = "Masuk Pembelajaran";
                btnSpinner.style.display = "none";
                submitBtn.disabled = false;
                alert("Gagal terhubung ke server database.");
            });
        });
    </script>
</body>
</html>
